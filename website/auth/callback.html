<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>poco start — Confirming…</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff8f0;
        color: #1a2744;
        padding: 24px;
        text-align: center;
      }
      a {
        color: #e23d28;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Opening poco start…</h1>
      <p>If the app does not open, <a id="open" href="#">tap here</a>.</p>
    </main>
    <script>
      (function () {
        var qs = window.location.search || '';
        var hash = window.location.hash || '';
        var deep = 'pocostart://auth/callback' + qs + hash;
        document.getElementById('open').href = deep;
        window.location.replace(deep);
      })();
    </script>
  </body>
</html>
